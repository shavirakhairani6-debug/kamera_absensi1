<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0">

  <title>ABSIS Camera</title>


  <!--
    HTML5 QR CODE
    Digunakan untuk membaca QR melalui kamera.
  -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #fff0f7,
          #eef5ff
        );

      font-family:
        Arial,
        sans-serif;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 12px;

    }


    .camera-card {

      width: 100%;

      max-width: 550px;

      background: white;

      border-radius: 28px;

      padding: 15px;

      box-shadow:
        0 10px 35px
        rgba(120,100,150,.15);

    }


    .title {

      text-align: center;

      padding: 8px;

    }


    .title h2 {

      margin:
        0 0 5px;

      color:
        #635669;

    }


    .title p {

      margin: 0;

      color:
        #9a8e9e;

      font-size: 12px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 22px;

    }


    .status {

      margin-top: 12px;

      padding: 12px;

      background:
        #faf7fb;

      border-radius: 16px;

      text-align: center;

      color:
        #786d7d;

      font-size: 13px;

    }


    .success {

      color:
        #258553;

      font-weight:
        bold;

    }


    .error {

      color:
        #b94d62;

      font-weight:
        bold;

    }


    .footer {

      text-align: center;

      color:
        #aaa;

      font-size: 10px;

      padding-top: 10px;

    }

  </style>

</head>


<body>


  <div class="camera-card">


    <div class="title">

      <h2>
        📷 Scan QR ABSIS
      </h2>

      <p>
        Arahkan kamera ke QR siswa
      </p>

    </div>


    <div id="reader"></div>


    <div
      id="status"
      class="status">

      ⏳ Menyiapkan kamera...

    </div>


    <div class="footer">

      ABSIS • Absensi Siswa

    </div>


  </div>


  <script>


    /*
     * ===========================================
     * KONFIGURASI CAMERA
     * ===========================================
     *
     * QR scanner menggunakan halaman GitHub Pages.
     *
     * Kamera tidak mengirim data ke GitHub.
     * Setelah QR terbaca, hasil dikirim ke
     * halaman ABSIS menggunakan postMessage.
     *
     */


    const SCANNER_NAME =
      'ABSIS_CAMERA';


    let scanner = null;


    let lastScannedCode = '';


    let lastScanTime = 0;


    /* ===========================================
       STATUS
       =========================================== */

    function setStatus(
      message,
      type
    ) {

      const box =
        document.getElementById(
          'status'
        );


      box.innerHTML =
        message;


      box.className =
        'status ' +
        (type || '');

    }


    /* ===========================================
       SCAN SUCCESS
       =========================================== */

    function onScanSuccess(
      decodedText,
      decodedResult
    ) {

      const code =
        String(
          decodedText || ''
        ).trim();


      if (!code) {
        return;
      }


      /*
       * Mencegah satu QR terkirim
       * berkali-kali dalam waktu singkat.
       */

      const now =
        Date.now();


      if (
        code === lastScannedCode &&
        now - lastScanTime < 5000
      ) {

        return;

      }


      lastScannedCode =
        code;


      lastScanTime =
        now;


      setStatus(
        '💗 QR terbaca! Mengirim ke ABSIS...',
        ''
      );


      /*
       * Kirim ke halaman Apps Script
       * yang sedang menampilkan iframe ini.
       */

      window.parent.postMessage(
        {
          type:
            'ABSIS_QR_SCAN',

          qrCode:
            code,

          scanner:
            SCANNER_NAME
        },
        '*'
      );


      /*
       * Beri jeda sebelum QR yang sama
       * boleh diproses kembali.
       */

      setTimeout(function() {

        setStatus(
          '📷 Silakan scan QR berikutnya...',
          ''
        );

      }, 1800);

    }


    /* ===========================================
       SCAN ERROR
       =========================================== */

    function onScanFailure(
      errorMessage
    ) {

      /*
       * Jangan menampilkan error
       * setiap frame karena akan terlalu ramai.
       */

    }


    /* ===========================================
       START CAMERA
       =========================================== */

    function startCamera() {

      scanner =
        new Html5Qrcode(
          'reader'
        );


      const config = {

        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.68;


          return {
            width: size,
            height: size
          };

        },

        aspectRatio:
          1.0

      };


      /*
       * Kamera belakang diprioritaskan.
       */

      scanner
        .start(
          {
            facingMode:
              {
                ideal:
                  'environment'
              }
          },

          config,

          onScanSuccess,

          onScanFailure

        )

        .then(function() {

          setStatus(
            '💚 Kamera aktif. Arahkan QR ke kotak scan.',
            'success'
          );

        })

        .catch(function(error) {

          console.error(
            error
          );


          setStatus(
            '❌ Kamera tidak dapat dibuka.<br>' +
            '<small>' +
            'Pastikan izin kamera diberikan dan halaman dibuka melalui HTTPS.' +
            '</small>',
            'error'
          );

        });

    }


    /* ===========================================
       LOAD
       =========================================== */

    window.addEventListener(
      'load',
      function() {

        if (
          typeof Html5Qrcode ===
          'undefined'
        ) {

          setStatus(
            '❌ Library QR tidak berhasil dimuat.',
            'error'
          );

          return;

        }


        startCamera();

      }
    );


  </script>


</body>

</html>
