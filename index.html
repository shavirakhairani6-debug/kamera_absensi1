<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">


  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1">


  <title>
    ABSIS Camera
  </title>


  <!--
    LIBRARY SCANNER QR
  -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing:
        border-box;
    }


    body {

      margin:
        0;

      min-height:
        100vh;

      font-family:
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff0f7,
          #eef5ff
        );

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        12px;

    }


    .card {

      width:
        100%;

      max-width:
        560px;

      background:
        white;

      border-radius:
        28px;

      padding:
        16px;

      box-shadow:
        0 10px 35px
        rgba(120,100,150,.15);

    }


    .title {

      text-align:
        center;

      margin-bottom:
        14px;

    }


    .title h2 {

      margin:
        0 0 5px;

      color:
        #5e5265;

    }


    .title p {

      margin:
        0;

      color:
        #999;

      font-size:
        12px;

    }


    #reader {

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        22px;

      background:
        #111;

    }


    .status {

      margin-top:
        12px;

      padding:
        13px;

      background:
        #faf7fb;

      border-radius:
        16px;

      text-align:
        center;

      color:
        #786d7d;

      font-size:
        13px;

    }


    .success {

      color:
        #258553;

      font-weight:
        bold;

    }


    .error {

      color:
        #bd5264;

      font-weight:
        bold;

    }


    .back {

      display:
        block;

      width:
        100%;

      margin-top:
        10px;

      padding:
        12px;

      border:
        0;

      border-radius:
        15px;

      background:
        #ff9ec8;

      color:
        white;

      font-weight:
        bold;

    }

  </style>

</head>


<body>


<div class="card">


  <div class="title">

    <h2>
      🐰 ABSIS
    </h2>

    <p>
      Scanner QR Absensi Siswa
    </p>

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    ⏳ Menyiapkan kamera...

  </div>


  <button
    class="back"
    onclick="goBack()">

    ← Kembali ke ABSIS

  </button>


</div>


<script>


/* =================================================
   CAMERA SCANNER
   ================================================= */


let scanner =
  null;


let lastCode =
  '';


let lastTime =
  0;


/* =================================================
   STATUS
   ================================================= */

function setStatus(
  text,
  type
) {

  const box =
    document.getElementById(
      'status'
    );


  box.innerHTML =
    text;


  box.className =
    'status ' +
    (
      type || ''
    );

}


/* =================================================
   SUCCESS
   ================================================= */

function onScanSuccess(
  decodedText,
  decodedResult
) {

  const code =
    String(
      decodedText || ''
    ).trim();


  if (!code) {
    return;
  }


  const now =
    Date.now();


  /*
   * Jangan kirim QR yang sama
   * berkali-kali.
   */

  if (
    code === lastCode &&
    now - lastTime < 5000
  ) {

    return;

  }


  lastCode =
    code;


  lastTime =
    now;


  /*
   * Cek format QR ABSIS
   */

  if (
    !code.startsWith(
      'ABSIS|'
    )
  ) {

    setStatus(
      '❌ Ini bukan QR ABSIS.',
      'error'
    );


    return;

  }


  setStatus(
    '💗 QR terbaca! Mengirim ke ABSIS...',
    ''
  );


  /*
   * =============================================
   * KIRIM KE WINDOW ABSIS
   * =============================================
   *
   * Ketika scanner dibuka dari ABSIS,
   * window.opener adalah halaman ABSIS.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {


    window.opener.postMessage(

      {

        type:
          'ABSIS_QR_SCAN',

        qrCode:
          code

      },

      '*'

    );


    setStatus(
      '🎉 QR berhasil dikirim ke ABSIS.<br>' +
      'Silakan lihat halaman ABSIS.',
      'success'
    );


  } else {


    /*
     * Jika scanner dibuka langsung,
     * tampilkan QR saja.
     */

    setStatus(

      '💗 QR terbaca:<br><br>' +

      '<b>' +
      escapeHtml(
        code
      ) +
      '</b><br><br>' +

      'Buka scanner melalui tombol ' +
      '📷 Buka Kamera di ABSIS.',

      'success'

    );

  }


  /*
   * Reset agar QR berikutnya
   * dapat dipindai.
   */

  setTimeout(
    function() {

      lastCode =
        '';

    },
    5000
  );

}


/* =================================================
   FAILURE
   ================================================= */

function onScanFailure(
  errorMessage
) {

  /*
   * Jangan menampilkan setiap error
   * karena scanner memanggil fungsi ini
   * berkali-kali saat mencari QR.
   */

}


/* =================================================
   START CAMERA
   ================================================= */

function startCamera() {

  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    setStatus(
      '❌ Library scanner tidak berhasil dimuat.',
      'error'
    );


    return;

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps:
      10,

    qrbox:
      function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * .70
          );


        return {

          width:
            size,

          height:
            size

        };

      },

    aspectRatio:
      1.0

  };


  /*
   * =============================================
   * PRIORITAS KAMERA BELAKANG
   * =============================================
   */

  scanner
    .start(

      {
        facingMode:
          'environment'
      },

      config,

      onScanSuccess,

      onScanFailure

    )

    .then(
      function() {

        setStatus(
          '💚 Kamera aktif.<br>' +
          'Arahkan QR siswa ke kotak scan.',
          'success'
        );

      }
    )

    .catch(
      function(error) {

        console.error(
          error
        );


        setStatus(

          '❌ Kamera tidak dapat dibuka.<br><br>' +

          '<small>' +

          'Pastikan:<br>' +

          '1. Website dibuka melalui HTTPS.<br>' +

          '2. Izin kamera diberikan.<br>' +

          '3. Browser tidak memblokir kamera.' +

          '</small>',

          'error'

        );

      }
    );

}


/* =================================================
   BACK
   ================================================= */

function goBack() {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

  } else {

    history.back();

  }

}


/* =================================================
   ESCAPE
   ================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/* =================================================
   START
   ================================================= */

window.addEventListener(
  'load',
  function() {

    startCamera();

  }
);


</script>


</body>

</html>
